# Runtime-enforced background-only input. Loaded once at MCP process startup.
# Missing/invalid policy must prevent startup; unlisted tools are denied.
allow:
  tools:
    - list_apps
    - list_windows
    - get_window_state
    - verify_state
    - debug_window_info
    - get_accessibility_tree
    - get_screen_size
    - get_desktop_state
    - get_cursor_position
    - get_agent_cursor_state
    - check_permissions
    - start_session
    - end_session
    - get_session
    - list_sessions
    - get_session_state
    - zoom
  rules:
    - tool: click
      constraints:
        delivery_mode:
          allowed: [background]
    - tool: double_click
      constraints:
        delivery_mode:
          allowed: [background]
    - tool: right_click
      constraints:
        delivery_mode:
          allowed: [background]
    - tool: drag
      constraints:
        delivery_mode:
          allowed: [background]
    - tool: type_text
      constraints:
        delivery_mode:
          allowed: [background]
    - tool: press_key
      constraints:
        delivery_mode:
          allowed: [background]
    - tool: hotkey
      constraints:
        delivery_mode:
          allowed: [background]
    - tool: set_value
      constraints:
        delivery_mode:
          allowed: [background]
    - tool: scroll
      constraints:
        delivery_mode:
          allowed: [background]
deny:
  tools:
    - bring_to_front
    - launch_app
    - set_window_frame
    - invoke_menu
    - clipboard_write
    - replay_trajectory
    - set_config
    - kill_app
